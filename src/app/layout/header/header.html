<header class="app-header">

  <!-- Brand -->
  <div class="header-brand">
    <div class="brand-logo">
      <span class="logo-icon">B</span>
    </div>

    <div class="brand-content">
      <span class="brand-name">BPMN.IO</span>
      <span class="brand-subtitle">Process Designer</span>
    </div>
  </div>

  <!-- Center Navigation -->
  <nav class="header-navigation">

    <a class="nav-item active">
      <span class="nav-icon">⌘</span>
      <span>Designer</span>
    </a>

    <a class="nav-item">
      <span class="nav-icon">▦</span>
      <span>Processes</span>
    </a>

    <a class="nav-item">
      <span class="nav-icon">◫</span>
      <span>Templates</span>
    </a>

  </nav>

  <!-- Actions -->
  <div class="header-actions">

    <!-- Search -->
    <button class="header-button search-button">
      <span class="button-icon">⌕</span>
      <span>Search</span>
      <kbd>Ctrl K</kbd>
    </button>

    <!-- Divider -->
    <div class="header-divider"></div>

    <!-- Notifications -->
    <button class="icon-button" title="Notifications">
      <span>♢</span>
      <i class="notification-dot"></i>
    </button>

    <!-- Theme -->
    <button class="icon-button" title="Change theme">
      <span>☼</span>
    </button>

    <!-- Save -->
    <button class="save-button">
      <span class="save-icon">✓</span>
      <span>Saved</span>
    </button>

    <!-- User -->
    <button class="user-menu">

      <div class="user-avatar">
        TS
      </div>

      <div class="user-info">
        <span class="user-name">Tajer System</span>
        <span class="user-role">Administrator</span>
      </div>

      <span class="user-arrow">⌄</span>

    </button>

  </div>

</header>
