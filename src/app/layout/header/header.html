<header class="app-header">
  <!-- Brand -->
  <div class="header-brand">
    <div class="brand-logo">
      <span class="logo-icon">B</span>
    </div>

    <div class="brand-content">
      <span class="brand-name">BPMN.IO</span>
      <span class="brand-subtitle">Process Designer</span>
    </div>
  </div>

  <!-- Center Navigation -->
  <nav class="header-navigation" aria-label="Main navigation">
    @for (menu of menus(); track menu.entityId) {
      <a
        class="nav-item"
        [routerLink]="menu.link"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="nav-icon" aria-hidden="true">
          {{ menu.icon }}
        </span>

        <span class="nav-title">
          {{ menu.title }}
        </span>
      </a>
    }
  </nav>
  <!-- Actions -->
  <div class="header-actions">
    <!-- Search -->
    <button class="header-button" type="button" aria-label="Open search">
      <span class="search-content">
        <span class="button-icon">⌕</span>
        <span class="search-label">Search</span>
      </span>

      <kbd>Ctrl K</kbd>
    </button>

    <!-- Divider -->
    <div class="header-divider"></div>

    <!-- Notifications -->
    <button class="icon-button" title="Notifications">
      <span>♢</span>
      <i class="notification-dot"></i>
    </button>

    <!-- Theme -->
    <button class="icon-button" title="Change theme">
      <span>☼</span>
    </button>

    <!-- Save -->
    <button class="save-button">
      <span class="save-icon">✓</span>
      <span>Saved</span>
    </button>

    <!-- User -->
    <button class="user-menu">
      <div class="user-avatar">TS</div>

      <div class="user-info">
        <span class="user-name">Tajer System</span>
        <span class="user-role">Administrator</span>
      </div>

      <span class="user-arrow">⌄</span>
    </button>
  </div>
</header>
